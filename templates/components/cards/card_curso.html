{% load static %}

<style>
    .course-card {
        width: 100%;
        max-width: 350px;
        background-color: #ffffff;
        border-radius: 24px; /* rounded-3xl */
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid #f3f4f6;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    /* Efeito Hover do Card Inteiro */
    .course-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .card-header {
        height: 160px; /* h-40 */
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* Variações de cor de fundo */
    .bg-pink { background-color: #fce7f3; } /* pink-100 */
    .bg-purple { background-color: #e9d5ff; } /* purple-200 */
    .bg-blue { background-color: #bfdbfe; } /* blue-200 */

    /* Padrão de listras diagonais */
    .stripes-pattern {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        opacity: 0.1;
        background-image: repeating-linear-gradient(45deg, #000 0, #000 2px, transparent 2px, transparent 10px);
    }

    .card-badge {
        position: absolute;
        top: 16px;
        left: 16px;
        background-color: #ffffff;
        color: #374151;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 9999px; /* rounded-full */
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        z-index: 10;
    }

    .card-icon {
        font-size: 48px; /* text-5xl */
        z-index: 10;
        transition: transform 0.3s ease;
    }
    
    /* Cores dos ícones */
    .icon-pink { color: #f472b6; } /* pink-400 */
    .icon-purple { color: #a855f7; } /* purple-500 */
    
    /* Animação do ícone ao passar o mouse no card */
    .course-card:hover .card-icon {
        transform: scale(1.1);
    }

    .card-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .card-title {
        font-size: 20px;
        font-weight: 700;
        color: #1f2937; /* gray-800 */
        margin: 0 0 8px 0;
    }

    .card-description {
        color: #6b7280; /* gray-500 */
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 16px 0;
        flex-grow: 1;
    }

    .card-meta {
        display: flex;
        align-items: center;
        font-size: 12px;
        color: #9ca3af; /* gray-400 */
        font-weight: 500;
        margin-bottom: 16px;
    }

    .card-meta span.dot {
        margin: 0 8px;
    }

    .card-meta i {
        margin-right: 4px;
    }

    .card-button {
        width: 100%;
        padding: 12px 0;
        background-color: #eff6ff; /* blue-50 */
        color: #1E3A8A; /* primary color */
        font-weight: 600;
        font-size: 16px;
        border: none;
        border-radius: 12px; /* rounded-xl */
        cursor: pointer;
        transition: background-color 0.2s, color 0.2s;
        font-family: inherit;
    }

    .card-button:hover {
        background-color: #1E3A8A;
        color: #ffffff;
    }
</style>





<div class="course-card">



    <div class="card-header {{ cor }}">
        <div class="stripes-pattern"></div>
        <span class="card-badge">{{ nivel }}</span>
        <i class="fa-solid {{ icone }} card-icon {{ cor }}"></i>
    </div>
    


    <div class="card-body">
        <h3 class="card-title">{{ titulo }}</h3>
        <p class="card-description">{{ descricao }}</p>
        
        <div class="card-meta">
            <i class="fa-regular fa-clock"></i> {{ carga_horaria }}
            <span class="dot">•</span>
            <i class="fa-solid fa-users"></i> {{ vagas }}
        </div>
        
        <button class="card-button">Saiba Mais</button>
    </div>
</div>
