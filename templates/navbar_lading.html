{% load static %}
<link href="{% static 'css/nav_bar_lading.css' %}" rel="stylesheet">

<header class="header">
    <div class="container header-content">
        {% include "components/logos/logo.html" %}

        <button class="mobile-menu-btn" aria-label="Abrir menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-links" aria-label="Navegação principal">
            <a href="{% url 'pode_aprender' %}#quem-somos">Quem Somos</a>
            <a href="{% url 'cursos' %}"{% if active_page == 'cursos' %} class="active" aria-current="page"{% endif %}>Cursos</a>
            <a href="{% url 'nossa_historia' %}"{% if active_page == 'historia' %} class="active" aria-current="page"{% endif %}>Nossa História</a>
            <a href="{% url 'nossa_equipe' %}"{% if active_page == 'equipe' %} class="active" aria-current="page"{% endif %}>Nossa Equipe</a>
        </nav>
        <div class="auth-buttons">
            <a href="{% url 'portal_aluno:login' %}" class="btn btn-primary">Portal do Aluno</a>
        </div>
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const menuBtn = document.querySelector('.mobile-menu-btn');
        const navLinks = document.querySelector('.nav-links');
        const authButtons = document.querySelector('.auth-buttons');
        const header = document.querySelector('.header');

        if(menuBtn) {
            menuBtn.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                authButtons.classList.toggle('active');
                header.classList.toggle('menu-open');
                
                const icon = menuBtn.querySelector('i');
                if (icon.classList.contains('fa-bars')) {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-xmark');
                } else {
                    icon.classList.remove('fa-xmark');
                    icon.classList.add('fa-bars');
                }
            });
        }
    });
</script>
